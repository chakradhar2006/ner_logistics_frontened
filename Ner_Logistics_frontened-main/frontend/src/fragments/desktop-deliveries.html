<div class="app-content">
<div class="page-head">
<div><div class="page-title" data-i18n="page_deliveries_title">Deliveries</div><div class="page-sub" data-i18n="page_deliveries_sub">Track assigned, in-progress, and completed deliveries.</div></div>
<div class="page-actions">
<button class="btn-outline" id="deliveriesExportBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>Export Data</button>
<button class="btn-solid-sm" id="deliveriesNewBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>New Delivery</button>
</div>
</div>
<div class="stat-grid">
<div class="stat-card"><div class="stat-top"><span class="stat-label">Active Deliveries</span><div class="stat-icon" style="background:var(--primary-light);color:var(--primary-dark);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"/></svg></div></div><div class="stat-value" id="deliveriesStatActive">—</div><div class="stat-note" id="deliveriesStatActiveNote"></div></div>
<div class="stat-card"><div class="stat-top"><span class="stat-label">Delivered</span><div class="stat-icon" style="background:var(--success-bg);color:var(--success);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg></div></div><div class="stat-value" id="deliveriesStatCompleted">—</div><div class="stat-note">All time</div></div>
<div class="stat-card"><div class="stat-top"><span class="stat-label">Scheduled</span><div class="stat-icon" style="background:#FEF3C7;color:#92400E;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></div></div><div class="stat-value" id="deliveriesStatScheduled">—</div><div class="stat-note">Not yet dispatched</div></div>
</div>
<div class="panel-card">
<div class="filter-bar">
<div class="search-input"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="deliveriesSearchInput" placeholder="Search deliveries, orders..."></div>
<div class="select-fake-wrap"><select id="deliveriesStatusFilter" class="select-fake"><option value="">All Status</option><option value="Scheduled">Scheduled</option><option value="Assigned">Assigned</option><option value="In Progress">In Progress</option><option value="Delayed">Delayed</option><option value="Completed">Completed</option><option value="Cancelled">Cancelled</option></select><svg class="select-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg></div>
<div class="select-fake-wrap"><select id="deliveriesDistrictFilter" class="select-fake"><option value="">All Districts</option></select><svg class="select-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg></div>
<div class="filter-flag" id="deliveriesClearFilters" style="display:none;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>Clear Filters</div>
</div>
<table class="roads-table">
<thead><tr><th>Delivery ID</th><th>Route</th><th>Driver</th><th>Status</th><th>ETA</th></tr></thead>
<tbody id="deliveriesTableBody">
<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--text-soft);">Loading deliveries…</td></tr>
</tbody>
</table>
<div class="table-foot">
<div id="deliveriesTableFootLabel">Loading…</div>
<div class="pagination" id="deliveriesPagination"></div>
</div>
</div>
</div>
